# ============================================================
#  DonutCore — Arenas GUI Configuration
#  Reskin the /donutarena admin menus from here: titles,
#  filler glass, and the main structural buttons. Text supports
#  MiniMessage tags (<green>, <bold>, <#rrggbb>, ...) and legacy
#  & codes — mix and match freely.
#  (The dynamic settings buttons inside a zone keep their
#   layout in code since their content changes per-setting.)
# ============================================================

prefix: '<dark_gray><bold>[<green>Arena<dark_gray>]<reset> '

filler: GRAY_STAINED_GLASS_PANE

list-menu:
  title: '<dark_gray><bold>Zone Manager'
  title-icon:
    material: BEACON
    displayname: '<dark_gray><bold>Zone Manager'
    lore:
      - '<gray>Manage all WorldGuard-based arena zones'
      - '<dark_gray>Click a zone to edit its settings'
  zone-item:
    material: GRASS_BLOCK
  create-button:
    material: LIME_DYE
    displayname: '<green><bold>+ Create Zone'
    lore:
      - '<gray>Click to create a new arena zone'
      - '<gray>You will need an existing WorldGuard region'
  prev-button:
    material: ARROW
    displayname: '<gray>← Previous'
  next-button:
    material: ARROW
    displayname: '<gray>Next →'

detail-menu:
  title: '<dark_gray>Zone: <yellow>%zone%'
  back-button:
    material: ARROW
    displayname: '<gray>← Back'
  delete-button:
    material: RED_WOOL
    displayname: '<red><bold>Delete Zone'
    lore:
      - '<gray>Click to permanently delete this zone'
  triggers-button:
    material: COMPASS
    displayname: '<aqua><bold>Triggers <gray>(%count%)'
    lore:
      - '<gray>Sub-regions that run a command and/or'
      - '<gray>teleport players when they are entered'
      - ''
      - '<dark_gray>Click to manage'
  autosave-note:
    material: GREEN_DYE
    displayname: '<green>Auto-Save'
    lore:
      - '<gray>All changes are saved automatically'

trigger-list-menu:
  title: '<dark_gray>Triggers: <yellow>%zone%'
  title-icon:
    material: COMPASS
    displayname: '<aqua><bold>Trigger Manager'
    lore:
      - '<gray>Sub-regions inside or near <yellow>%zone%'
      - '<dark_gray>Click a trigger to edit its settings'
  trigger-item:
    material: COMPASS
  create-button:
    material: LIME_DYE
    displayname: '<green><bold>+ Create Trigger'
    lore:
      - '<gray>Click to create a new trigger'
      - '<gray>You will need an existing WorldGuard region'
  back-button:
    material: ARROW
    displayname: '<gray>← Back to Zone'

trigger-detail-menu:
  title: '<dark_gray>Trigger: <yellow>%trigger%'
  back-button:
    material: ARROW
    displayname: '<gray>← Back to Triggers'
  delete-button:
    material: RED_WOOL
    displayname: '<red><bold>Delete Trigger'
    lore:
      - '<gray>Click to permanently delete this trigger'
  set-location-button:
    material: ENDER_PEARL
    displayname: '<light_purple><bold>Set Teleport Location'
    lore:
      - '<gray>Click to set the teleport target'
      - '<gray>to your current position'

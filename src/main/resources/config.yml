# ============================================================
#  MODULE TOGGLES
#  Enable or disable each module independently.
#  Use /donutcore module <name> <enable|disable> in-game.
# ============================================================
modules:
  crates: true
  sell: true
  enderchest: true
  arenas: false
  fastcrystals: false
  stash: false
  vipfeatures: false
  hide: false

# ============================================================
#  ARENAS MODULE
#  Requires WorldGuard to be installed on the server.
#  Create arenas in-game: /arena create <name> <wg-region>
#  Arena data is saved in  plugins/DonutCore/arenas.yml
#
#  Per-arena config (set with /arena set* commands):
#    interval  —  reward interval  (e.g. 1m | 30s | 2m30s)
#    command   —  console command  — use {player} placeholder
#    display   —  actionbar | title | text | all
#
#  Text placeholders:
#    {time}  — countdown to next reward  (e.g. "1m 45s")
# ============================================================
arenas:
  location-check-interval: 1

# ============================================================
#  FAST CRYSTALS MODULE
#  Grants players a brief immunity window against their own
#  end crystal explosions, enabling fast-crystal PvP style.
# ============================================================
fastcrystals:
  self-damage-immunity-ms: 500

# ============================================================
#  STASH MODULE  —  Admin anti-cheat utility
#  Requires WorldEdit. Build a bait stash anywhere (e.g. a
#  loaded chest floating in the void), select it with WorldEdit,
#  then save and redeploy it anywhere as a schematic. Every
#  container inside is auto-marked as a trap: when a non-staff
#  player opens one, all online staff with donutcore.admin.stash
#  get a chat alert + console log — go spectator/vanish and
#  watch who's looting it before banning them.
#
#  Commands (/donutstash, alias /stash):
#    save <name>    — save your current WorldEdit selection
#                     (air blocks are skipped automatically)
#    spawn <name>   — paste it at your location, auto-marks
#                     every container inside as a trap
#    remove <name>  — delete a saved schematic
#    list           — list saved schematics
#    mark <name>    — manually mark the container you look at
#    unmark         — remove the mark from the looked-at container
# ============================================================

# ============================================================
#  VIP FEATURES MODULE
#  Gives VIP players a custom chat and name color.
#
#  Placeholders (requires PlaceholderAPI):
#    %donutcore_chatcolor%  — player's chat color code, or "" if not set
#    %donutcore_namecolor%  — player's name color code, or "" if not set
#
#  Priority logic:
#    If the placeholder is empty (""), EssentialsX (or any chat plugin)
#    will use the rank/group color as normal.
#    If the player set a color, it overrides the rank color.
#
#  EssentialsX chat format example:
#    format: '<{GROUP}> %donutcore_namecolor%{DISPLAYNAME}&r: %donutcore_chatcolor%{MESSAGE}'
#
#  Commands:
#    /chatcolor <&X | &#RRGGBB | reset>   — set chat color
#    /namecolor <&X | &#RRGGBB | reset>   — set name color
#
#  Permissions:
#    donutcore.vip.chatcolor   — use /chatcolor
#    donutcore.vip.namecolor   — use /namecolor
#
#  Data is stored in: plugins/DonutCore/vipcolors.yml
# ============================================================

# ============================================================
#  HIDE MODULE
#  /hide     (donutcore.hide.vip)    — VIP / Streamer mode:
#    Hides the floating name tag above the player's head,
#    clears their tab-list entry, and applies a random fake
#    skin from vip-fake-skins below.
#
#  /staffhide <FakeName> [SkinName|UUID]
#            (donutcore.hide.staff)  — Staff camouflage:
#    Disguises staff as a regular player with a custom name
#    and any player's skin fetched live from Mojang API.
#    Skin supports player names (e.g. Notch) or UUIDs.
#    /staffhide with no args deactivates camouflage.
#
#  Restore on disconnect:
#    Original skin / tab-name are always auto-restored when
#    the player disconnects, preventing permanent corruption.
#
#  Skins are fetched async from:
#    api.mojang.com  +  sessionserver.mojang.com
#    (Mojang rate limit: 600 req / 10 min per IP — safe for
#    normal staff usage)
# ============================================================
hide:
  # Skin names randomly picked for /hide (VIP mode).
  # Can be player names or UUID strings.
  # Remove all entries to disable random skin change for VIP hide.
  vip-fake-skins:
    - Notch
    - jeb_
    - Dinnerbone
    - Grumm
